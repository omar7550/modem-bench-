[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "modembench"
version = "0.1.0"
description = "Deterministic signal-recovery benchmark spine"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.1",
    "scipy==1.18.0",
    "pytest==9.1.1",
]

[project.scripts]
modembench = "modembench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
